<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="instituteBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066d6"/>
      <stop offset="100%" stop-color="#004ca8"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA820A"/>
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="250" cy="250" r="235" fill="none" stroke="#0066d6" stroke-width="12"/>
  <circle cx="250" cy="250" r="215" fill="#ffffff" stroke="#0066d6" stroke-width="4"/>

  <!-- Circular Text Paths -->
  <!-- Top Right Path for English Text -->
  <path id="textPathEnglish" d="M 390 145 A 185 185 0 0 1 340 395" fill="none" stroke="none" />
  
  <!-- Top Left Path for Arabic Text -->
  <path id="textPathArabic" d="M 160 395 A 185 185 0 0 1 110 145" fill="none" stroke="none" />

  <!-- English Text: INSTITUTE OF ISLAMIC GUIDANCE -->
  <text fill="#0066d6" font-family="'Cinzel', 'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" letter-spacing="3.5">
    <textPath href="#textPathEnglish" startOffset="50%" text-anchor="middle">
      INSTITUTE OF ISLAMIC GUIDANCE
    </textPath>
  </text>

  <!-- Arabic Text: معهد الإرشاد الإسلامي -->
  <text fill="#0066d6" font-family="'Amiri', 'Traditional Arabic', serif" font-weight="bold" font-size="28" letter-spacing="1">
    <textPath href="#textPathArabic" startOffset="50%" text-anchor="middle">
      مَعْهَدُ الإِرْشَادِ الإِسْلاَمِي
    </textPath>
  </text>

  <!-- Bottom Star -->
  <path d="M 250 435 L 253.5 444 L 263 444.5 L 255.5 450 L 258 459 L 250 453.5 L 242 459 L 244.5 450 L 237 444.5 L 246.5 444 Z" fill="#0066d6" />

  <!-- Center Arch / Minaret Dome Contour -->
  <path d="M 175 250 C 175 160 210 90 250 90 C 290 90 325 160 325 250 C 325 320 290 380 250 380 C 210 380 175 320 175 250 Z" fill="#0066d6" />
  
  <!-- Inner White Field inside Dome -->
  <path d="M 195 240 C 195 180 220 120 250 120 C 280 120 305 180 305 240 L 305 320 L 275 365 L 250 395 L 225 365 L 195 320 Z" fill="#ffffff" />

  <!-- Central Pen Nib / Pillar -->
  <path d="M 215 160 L 285 160 L 285 300 L 265 335 L 255 335 L 255 385 L 245 385 L 245 335 L 235 335 L 215 300 Z" fill="#0066d6" />
  
  <!-- Inner Nib Core Cutout -->
  <path d="M 223 168 L 277 168 L 277 295 L 259 327 L 253 327 L 253 380 L 247 380 L 247 327 L 241 327 L 223 295 Z" fill="#ffffff" />

  <!-- Top Open Quran Book (resting on arch) -->
  <g transform="translate(250, 130) scale(0.95)">
    <!-- Book Spine -->
    <path d="M 0 -22 L 0 12" stroke="#0066d6" stroke-width="4" stroke-linecap="round"/>
    <!-- Left Pages -->
    <path d="M 0 10 C -25 3 -50 14 -70 8 L -70 -26 C -50 -20 -25 -31 0 -24 Z" fill="#ffffff" stroke="#0066d6" stroke-width="5" stroke-linejoin="round" />
    <path d="M -12 -18 C -30 -24 -48 -16 -62 -20" stroke="#0066d6" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M -12 -8 C -30 -14 -48 -6 -62 -10" stroke="#0066d6" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M -12 2 C -30 -4 -48 4 -62 0" stroke="#0066d6" stroke-width="2.5" fill="none" stroke-linecap="round" />
    
    <!-- Right Pages -->
    <path d="M 0 10 C 25 3 50 14 70 8 L 70 -26 C 50 -20 25 -31 0 -24 Z" fill="#ffffff" stroke="#0066d6" stroke-width="5" stroke-linejoin="round" />
    <path d="M 12 -18 C 30 -24 48 -16 62 -20" stroke="#0066d6" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M 12 -8 C 30 -14 48 -6 62 -10" stroke="#0066d6" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M 12 2 C 30 -4 48 4 62 0" stroke="#0066d6" stroke-width="2.5" fill="none" stroke-linecap="round" />

    <!-- Center Book Ribbon -->
    <path d="M 0 12 L 0 24 L -4 20 L 0 28 L 4 20 L 0 24" fill="#0066d6" />
  </g>
</svg>
